name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只有这些权限，够用
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；已经在跑的不打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- #
  # 1. 密钥扫描：历史里翻出任何疑似凭据就整体失败
  # ---------------------------------------------------------------- #
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks 要扫完整历史
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------------------------------------------------------------- #
  # 2. 构建静态站
  # ---------------------------------------------------------------- #
  build:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # lastUpdated 依赖 git 提交时间，浅克隆会导致时间全是构建那一刻
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 开启 / 配置 GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 上传产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  # ---------------------------------------------------------------- #
  # 3. 发布
  # ---------------------------------------------------------------- #
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
