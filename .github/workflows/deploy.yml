name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只有这些权限，够用
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；已经在跑的不打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- #
  # 1. 密钥扫描：全历史扫，任何疑似凭据就整体失败
  # ---------------------------------------------------------------- #
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 要扫完整历史，浅克隆不行

      # 不用 gitleaks-action：它不认 -c，只能用默认规则，
      # 结果就是 .gitleaks.toml 里的白名单不生效（或者反过来，整份配置白写）。
      # 直接装官方二进制，把配置文件显式传进去。
      - name: 安装 gitleaks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(gh release view --repo gitleaks/gitleaks --json tagName --jq .tagName)
          gh release download "$version" --repo gitleaks/gitleaks \
            --pattern '*_linux_x64.tar.gz' --output - | tar -xz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: 扫描
        run: |
          set -euo pipefail
          # --redact：命中时只打码上报，不把密钥本身打进日志
          gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .

  # ---------------------------------------------------------------- #
  # 2. 构建静态站
  #    故意不写 needs: secret-scan —— 两者并行跑，谁都不挡谁；
  #    deploy 同时依赖两者，所以密钥扫描没过照样发不出去。
  #    secret-scan 只要 6s，串行的话白白多等一个 job 的调度（~15s）。
  # ---------------------------------------------------------------- #
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # lastUpdated 依赖 git 提交时间，浅克隆会导致时间全是构建那一刻
          fetch-depth: 0

      # 版本由 package.json 的 packageManager 字段决定，
      # 这里不要再写 version，否则 pnpm/action-setup@v6 会报版本冲突
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 开启 / 配置 GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 上传产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  # ---------------------------------------------------------------- #
  # 3. 发布
  # ---------------------------------------------------------------- #
  deploy:
    needs: [secret-scan, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
