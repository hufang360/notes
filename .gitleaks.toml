# gitleaks 配置
# 在 hooks/pre-commit、pnpm check 和 CI 里使用
# 语法参考：https://github.com/gitleaks/gitleaks#configuration

title = "notes 仓库密钥扫描规则"

[extend]
# 继承 gitleaks 内置的全部规则（1000+ 条：AWS / GitHub / Slack / 私钥 / 各类 token）
useDefault = true

# --------------------------------------------------------------------------- #
# 关于白名单的一条铁律：
#
# **不要加 `docs/.*\.md$` 这类路径白名单。**
#
# 这个仓库的正文本来就是笔记，把 docs/ 排除掉等于让扫描形同虚设 ——
# 真把服务器密码写进笔记，pnpm check 也会一路绿灯。
# 白名单只用来放行「已经人工确认过是假值」的具体字符串。
# 宁可误报，也不要漏报。
# --------------------------------------------------------------------------- #

[[allowlists]]
description = "cv21314034 里作者明确标注为失效的 B 站直播配置示例"
regexes = [
  '''TaPGcesj0aPoJpektLsyVzcuNAKKOU''',
  '''B8HfOO6oJanyL7CzDnPfYg9h''',
]

[[allowlists]]
description = "cv11045619 里 TShock REST API 的示例 token（文档用，非真实环境）"
regexes = [
  '''1DB46B3C6509122169E7332C4AA7A54A3ECA64F07AF7017DCE84F038EC95B718''',
]

[[allowlists]]
description = "通用的占位符写法，不是真值"
regexes = [
  '''change[-_]?me''',
  '''your[-_][a-z0-9]*[-_](here|key|token|password|secret)''',
  '''xxx+''',
  '''\bfoo[-_]?bar\b''',
  '''example\.(com|org|net)''',
  '''127\.0\.0\.1''',
  '''\{\{[a-zA-Z_]+\}\}''', # {{url}} / {{token}}，Postman 风格的变量
  '''\$\{[A-Z_]+\}''', # ${API_KEY}
  '''<[A-Z][A-Z_]{2,}>''', # <YOUR_TOKEN>
]
